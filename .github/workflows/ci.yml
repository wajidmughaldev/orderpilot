name: CI — Five-Layer Test & Quality Gate

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Build & Multi-Layer Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. Typecheck (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: 2. Unit Testing & Coverage
        run: pnpm test:unit

      - name: 3. Security Audits & Injection Hardening
        run: pnpm test:security

      - name: 4. Build Next.js Production Assets
        run: pnpm build

      - name: 5. Integration & Regression API Suite
        run: pnpm test

      - name: Install Playwright Browsers & Dependencies
        run: pnpm exec playwright install --with-deps

      - name: 6. End-to-End Playwright Tests
        run: pnpm test:e2e

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
